server:
  port: ${PORT:8081}
  error:
    include-message: always

spring:
  application:
    name: artistapp-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vrb_artistapp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Madrid}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null

artistapp:
  jwt:
    # Set JWT_SECRET in the environment to a random secret of at least 32 characters.
    secret: ${JWT_SECRET:change-this-development-secret-before-deploying-123456}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

logging:
  level:
    org.springframework.jdbc.core: INFO